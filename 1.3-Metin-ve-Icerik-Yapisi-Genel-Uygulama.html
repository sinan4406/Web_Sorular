<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metin ve İçerik Yapısı · Genel Uygulama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fsp:1px;
  --bg:#06091a;
  --surface:rgba(17,24,56,.68);
  --surface-2:rgba(19,29,68,.92);
  --text:#f2f4ff;
  --muted:#a8b2d4;
  --line:rgba(158,174,235,.18);
  --cyan:#38d9ff;
  --blue:#5b7cfa;
  --violet:#a978ff;
  --pink:#ff7ac6;
  --orange:#ff9d5c;
  --yellow:#ffd45c;
  --green:#56e6a5;
  --danger:#ff6b8a;
  --radius-lg:22px;
  --radius-md:14px;
  --shadow:0 20px 60px rgba(0,0,0,.35);
  --mono:"DM Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html{font-size:15px;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:"Manrope","Segoe UI",system-ui,sans-serif;font-size:calc(1rem + var(--fsp));line-height:1.6;
  background:
    radial-gradient(1100px 600px at 85% -10%,rgba(91,124,250,.20),transparent 60%),
    radial-gradient(900px 520px at -10% 110%,rgba(169,120,255,.16),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
code{font-family:var(--mono);font-size:.92em;background:rgba(56,217,255,.10);color:#bfefff;border:1px solid rgba(56,217,255,.18);border-radius:6px;padding:.05em .38em}
b,strong{color:#fff}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
a{color:var(--cyan)}

.wrap{max-width:1240px;margin:0 auto;padding:28px 22px 70px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted);font-size:calc(.8rem + var(--fsp));letter-spacing:.08em;font-weight:700}
.topbar .dot{width:9px;height:9px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px var(--violet)}
.topbar .rule{flex:1;height:1px;background:var(--line)}
h1.topic{margin:.1em 0 .25em;font-size:calc(clamp(1.5rem,3vw,2.2rem) + var(--fsp));line-height:1.2;font-weight:800;
  background:linear-gradient(90deg,var(--cyan),var(--violet) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);font-size:calc(1.05rem + var(--fsp));margin:0 0 1.2rem;max-width:880px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:24px 26px;backdrop-filter:blur(8px)}
.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-bottom:26px}
.intro h2{font-size:calc(1rem + var(--fsp));margin:0 0 8px}
.intro ol{margin:0;padding-left:1.2em;color:var(--muted);font-size:calc(.92rem + var(--fsp))}
.intro ol li{margin:.2em 0}
.toc{display:grid;gap:8px}
.cov{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cov li{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:calc(.86rem + var(--fsp))}
.cov li b{color:var(--cyan);font-weight:700}
.cov li span{color:var(--muted)}
.toc a{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
.toc a:hover{border-color:rgba(56,217,255,.5)}
.toc a span{font-family:var(--mono);color:var(--violet);font-size:calc(.8rem + var(--fsp));flex:none}
.toc a em{font-style:normal;color:var(--muted);font-weight:500;font-size:calc(.84rem + var(--fsp));margin-left:auto}

/* Uygulama */
.app{margin-bottom:30px;scroll-margin-top:16px}
.app-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:4px}
.app-no{font-family:var(--mono);color:var(--violet);font-size:calc(.85rem + var(--fsp));letter-spacing:.06em}
.app h2{margin:0;font-size:calc(clamp(1.15rem,1.85vw,1.5rem) + var(--fsp));font-weight:800}
.badge{font-size:calc(.72rem + var(--fsp));font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;border:1px solid rgba(255,212,92,.4);color:var(--yellow);background:rgba(255,212,92,.08)}
.scen{color:var(--muted);margin:2px 0 16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.lbl{font-size:calc(.78rem + var(--fsp));font-weight:800;letter-spacing:.08em;color:var(--cyan);margin:0 0 8px;text-transform:none}
.tree{margin:0 0 16px;background:#050816;border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 16px;font-family:var(--mono);font-size:calc(.84rem + var(--fsp));line-height:1.55;color:#d7defa;white-space:pre;overflow:auto}
.reqs{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:7px;counter-reset:rq}
.reqs li{counter-increment:rq;display:grid;grid-template-columns:22px 26px 1fr;gap:8px;align-items:start;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:calc(.94rem + var(--fsp))}
.reqs li::before{content:counter(rq);grid-column:2;grid-row:1;font-family:var(--mono);color:var(--muted);font-size:.88em;padding-top:2px}
.reqs li input{grid-column:1;grid-row:1;width:18px;height:18px;margin:3px 0 0;accent-color:var(--green);cursor:pointer}
.reqs li span{grid-column:3;grid-row:1}
.reqs li.done{border-color:rgba(86,230,165,.45);background:rgba(86,230,165,.07)}
.reqs li.done span{color:var(--muted)}
.prog{font-family:var(--mono);font-size:calc(.8rem + var(--fsp));color:var(--muted);margin:-6px 0 14px}
.prog b{color:var(--green)}
.self{border:1px solid rgba(169,120,255,.35);background:rgba(169,120,255,.07);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:12px}
.self .h{font-weight:800;color:var(--violet);font-size:calc(.86rem + var(--fsp));letter-spacing:.04em;margin-bottom:4px}
.self p{margin:0}
.self .ans{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(169,120,255,.35);color:#d9ccff}
.self.open .ans{display:block}
.link-btn{background:none;border:none;color:var(--violet);font-weight:700;padding:0;margin-top:8px;font-size:calc(.86rem + var(--fsp))}
.note{border:1px solid rgba(56,217,255,.3);background:rgba(56,217,255,.06);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:12px;font-size:calc(.9rem + var(--fsp));color:#cfefff}

/* Tarayıcı */
.browser{border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.chrome{display:flex;align-items:center;gap:8px;background:#e9ebf3;padding:7px 10px;color:#2b3150}
.chrome .tab{font-size:calc(.74rem + var(--fsp));font-weight:700;background:#fff;border-radius:8px 8px 0 0;padding:4px 10px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:flex-end;margin-bottom:-7px}
.chrome .bar{display:flex;align-items:center;gap:6px;background:#f6f7fb;padding:6px 10px;border-top:1px solid #d6d9e6}
.chrome .bar button{border:none;background:#e3e6f0;border-radius:6px;width:28px;height:26px;color:#2b3150;font-weight:700}
.chrome .bar button:disabled{opacity:.4}
.chrome .addr{flex:1;min-width:0;background:#fff;border:1px solid #d6d9e6;border-radius:999px;padding:3px 12px;font-family:var(--mono);font-size:calc(.74rem + var(--fsp));color:#2b3150;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrome .addr.hit{border-color:#5b7cfa;box-shadow:0 0 0 2px rgba(91,124,250,.25)}
iframe.preview{display:block;width:100%;height:400px;border:0;background:#fff}
.navline{display:flex;gap:10px;background:#0b1027;border-top:1px solid var(--line);padding:7px 12px;font-family:var(--mono);font-size:calc(.76rem + var(--fsp));color:#d7defa;min-height:34px;align-items:center}
.navline .k{color:var(--yellow);font-weight:500;letter-spacing:.06em;flex:none}

/* Çözüm */
.sol{margin-top:14px}
.sol-btn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 16px;font-weight:700}
.sol-body{display:none;margin-top:12px}
.sol.open .sol-body{display:block}
.ftabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ftabs button{font-family:var(--mono);font-size:calc(.76rem + var(--fsp));border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;padding:4px 10px;color:var(--muted)}
.ftabs button.on{border-color:var(--cyan);color:#fff;background:rgba(56,217,255,.1)}
pre.code{margin:0;background:#050816;border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:calc(.82rem + var(--fsp));line-height:1.6;color:#d7defa;tab-size:2;max-height:520px}
pre.code .fn{display:block;color:var(--muted);font-size:calc(.72rem + var(--fsp));letter-spacing:.06em;margin:-4px 0 8px;font-family:"Manrope",sans-serif;font-weight:700}
.t-tag{color:#ff8fb8}.t-att{color:#ffd45c}.t-str{color:#7ef0b8}.t-com{color:#6f7aa3;font-style:italic}.t-pun{color:#8f9bd0}.t-ent{color:#38d9ff}
.sol-note{color:var(--muted);font-size:calc(.86rem + var(--fsp));margin:8px 0 0}
.starter{margin-bottom:14px}

.foot{margin-top:18px;text-align:center;color:#6f7aa3;font-size:calc(.78rem + var(--fsp))}
.print-btn{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:9px 16px;font-weight:700;margin-top:14px}

@media (max-width:900px){
  .intro,.split{grid-template-columns:minmax(0,1fr)}
  iframe.preview{height:360px}
}
@media (max-width:640px){
  html{font-size:14px}
  .wrap{padding:18px 14px 40px}
  .card{padding:18px 14px}
  code{overflow-wrap:anywhere}
  .toc a{flex-wrap:wrap}
  .toc a em{margin-left:0;width:100%}
}
@media print{
  html{font-size:12px}
  body{background:#fff;color:#000}
  .preview-col{display:none!important}
  .card.app{padding:0;border:none}
  .reqs{gap:4px}
  .reqs li{padding:5px 10px}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #bbb;background:#fff;backdrop-filter:none;break-inside:auto}
  h1.topic{color:#000;background:none;-webkit-text-fill-color:#000}
  .subtitle,.scen,.prog,.self .h,.lbl,.app-no,.topbar{color:#333}
  .intro,.toc,.print-btn,.browser,.sol,.link-btn,.preview-col .lbl,.foot,.prog,.navline{display:none!important}
  .split{display:block}
  .reqs li{background:#fff;border:1px solid #ccc;break-inside:avoid}
  .reqs li input{display:none}
  .reqs li{grid-template-columns:26px 1fr}
  .reqs li::before{grid-column:1}
  .reqs li span{grid-column:2;color:#000!important}
  .self{background:#fff;border-color:#999}
  .self .ans{display:none!important}
  code{background:#f2f2f2;color:#000;border-color:#ccc}
  .tree,pre.code{background:#f7f7f7;color:#000;border-color:#ccc;max-height:none}
  .tree *,pre.code *{color:#000!important}
  .app{break-before:page}
  #u1{break-before:auto}
  b,strong{color:#000}
  .note{background:#fff;color:#000;border-color:#999}
}
</style>
</head>

 onu uygulamasın.", "Ardından, atölyede yazılacak iki satırlık kod **çok satırlı bir kod bloğu** olarak görünsün: ilk satırda `<h1>Merhaba Dünya<\/h1>`, ikinci satırda `<p>Bu benim ilk web sayfam.<\/p>`. Blok hem satır düzenini korusun hem de içeriğin kod olduğunu belirtsin.", "Kod bloğunun altındaki paragrafta \"maker\" kelimesi yabancı bir terim olarak eğik görünsün; vurgu anlamı taşımasın. Ekran okuyucu bu kelimeyi İngilizce okusun.", "\"Başvuru\" bölümünde \"Projeler yalnızca takım hâlinde kabul edilecektir.\" cümlesindeki \"yalnızca takım hâlinde\" ifadesi **cümle içi vurgu** olarak işaretlensin.", "Bir sonraki paragrafta \"Son başvuru: 15 Kasım 2026\" yazsın; yalnızca tarih **güçlü önem** taşıyan bilgi olarak işaretlensin.", "\"Konuk Konuşmacı\" bölümünde konuşmacının \"Gençlerin projelerini görmek için sabırsızlanıyorum.\" sözü **cümlenin içinde** alıntı olarak yer alsın; tırnak işaretlerini tarayıcı eklesin.", "Aynı bölümde konuşmacının kitabından iki cümlelik uzun bir alıntı **kendi başına bir bölüm** olarak dursun; metni bu bölümün içinde bir paragraf olsun. Alıntının alındığı sayfanın adresi (`https://ornek-yayinevi.com/kod-yazan-genclik`) alıntıya eklensin ama ekranda **görünmesin**. Altındaki paragrafta \"Kaynak:\" yazısından sonra kitabın adı \"Kod Yazan Gençlik\" **eser adı** olarak işaretlensin.", "\"İletişim\" bölümüne geçmeden önce konunun değiştiğini belirten bir ayraç bulunsun.", "\"İletişim\" bölümünde okulun adı, mahalle–cadde satırı ve ilçe–il satırı **tek paragrafın içinde**, alt alta üç satırda görünsün.", "CSS ekleme; kalın, eğik, girintili ve eş aralıklı görünümler tarayıcının varsayılanından gelsin."], "self": {"q": "Sayfanın başlık ağacını çiz: hangi başlık hangisinin altında? \"Akıllı Sera\" ile son başvuru tarihi ekranda ikisi de kalın; kodda neden farklı işaretlendiler? Konuşmacının adını da eser adı gibi işaretlemek doğru olur muydu?", "a": "Ağaç: ana başlık → Etkinlik Bilgileri (→ Sergi Alanları, Kimya Atölyesi, Kodlama Atölyesi), B /p>\n  <blockquote cite=\"https://ornek-yayinevi.com/kod-yazan-genclik\">\n    <p>Bir proje, bir fikri başkalarıyla paylaşmanın en somut yoludur. Hata yapmaktan korkmayan öğrenci, her denemede bir adım daha ileri gider.<\/p>\n  <\/blockquote>\n  <p>Kaynak: <cite>Kod Yazan Gençlik<\/cite><\/p>\n\n  <hr>\n\n  <h2>İletişim<\/h2>\n  <p>Cumhuriyet Anadolu Lisesi<br>Yenidoğan Mahallesi, Okul Caddesi No: 5<br>Atakum / Samsun<\/p>\n<\/body>\n<\/html>\n"}, "start": "index.html"}], "coverage": [["Başlık hiyerarşisi", "Gereksinim 2, 5"], ["Paragraf", "Bütün bölümler"], ["Güçlü önem ve cümle içi vurgu", "Gereksinim 11, 12"], ["Anlamsız kalın ve eğik (ayrışma, farklı kip)", "Gereksinim 6, 10"], ["Satır sonu ve konu geçişi", "Gereksinim 15, 16"], ["Uzun alıntı, satır içi alıntı, eser adı", "Gereksinim 13, 14"], ["Satır içi kod ve kod bloğu", "Gereksinim 8, 9"], ["Karakter varlıkları", "Gereksinim 3, 8, 9"], ["Alt ve üst simge", "Gereksinim 4, 7"]]};
</script>
<script>
(function(){
"use strict";
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(s){
  if(s==null) return '';
  return String(s).split('`').map((p,i)=>i%2?'<code>'+esc(p)+'</code>':esc(p).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')).join('');
}
function hlHTML(src){
  let out='',i=0;
  const re=/<\!--[\s\S]*?(?:-->|$)|<\/?[A-Za-z!][^>]*>?|&[#A-Za-z0-9]+;/g;let m;
  while((m=re.exec(src))){
    out+=esc(src.slice(i,m.index));
    const t=m[0];
    if(t.startsWith('<\x21--')) out+='<span class="t-com">'+esc(t)+'</span>';
    else if(t[0]==='&') out+='<span class="t-ent">'+esc(t)+'</span>';
    else out+=hlTag(t);
    i=m.index+t.length;
  }
  return out+esc(src.slice(i));
}
function hlTag(t){
  const m=/^(<\/?)([!A-Za-z][\w-]*)([\s\S]*?)(\/?>)?$/.exec(t);
  if(!m) return esc(t);
  let attrs=m[3].replace(/([^\s=]+)(\s*=\s*)?("[^"]*"?|'[^']*'?|[^\s"'>]+)?/g,function(all,n,eq,v){
    if(!n) return all;
    let r='\u0001A'+n+'\u0002'; if(eq) r+=eq; if(v) r+='\u0001S'+v+'\u0002'; return r;
  });
  attrs=esc(attrs).replace(/\u0001A([\s\S]*?)\u0002/g,'<span class="t-att">$1</span>').replace(/\u0001S([\s\S]*?)\u0002/g,'<span class="t-str">$1</span>');
  return '<span class="t-pun">'+esc(m[1])+'</span><span class="t-tag">'+esc(m[2])+'</span>'+attrs+(m[4]?'<span class="t-pun">'+esc(m[4])+'</span>':'');
}

const app=document.getElementById('app');
const apps=DATA.apps;
document.getElementById('topCount').textContent=DATA.coverage.length+' alt konu';

let h='<h1 class="topic">'+esc(DATA.title)+'</h1><p class="subtitle">'+md(DATA.subtitle)+'</p>';
h+='<section class="card intro"><div class="how"><h2>Nasıl çalışılır?</h2><ol>'+
  '<li>Masaüstünde uygulama için bir klasör aç ve dosyaları <b>VS Code</b> ile kendin yaz.</li>'+
  '<li>Gereksinimleri tek tek uygula; bitirdiğin maddenin kutusunu işaretle.</li>'+
  '<li>Sayfanı tarayıcıda açıp sağdaki <b>bitmiş sayfa</b> önizlemesiyle karşılaştır. Önizleme yalnızca sonucu gösterir, kodu göstermez.</li>'+
  '<li><b>Kendini sına</b> sorusunu cevaplamadan cevabına bakma.</li>'+
  '<li><b>Örnek çözüm</b> en son açılır. Senin çözümün farklı olabilir; gereksinimleri karşılıyorsa doğrudur.</li>'+
  '</ol><button class="print-btn" onclick="window.print()">Gereksinimleri yazdır</button></div>'+
  '<div><h2>Bu uygulamada pekiştirilen konular</h2><ul class="cov">'+DATA.coverage.map(c=>'<li><b>'+esc(c[0])+'</b><span>'+md(c[1])+'</span></li>').join('')+'</ul></div></section>';

apps.forEach((a,i)=>{
  h+='<section class="card app" id="u'+(i+1)+'"><div class="app-head"><span class="app-no">'+(apps.length===1?'GENEL UYGULAMA':'UYGULAMA '+(i+1))+'</span><h2>'+esc(a.title)+'</h2>'+(a.badge?'<span class="badge">'+esc(a.badge)+'</span>':'')+'</div>'+
    '<p class="scen">'+md(a.scenario)+'</p><div class="split"><div>';
  if(a.tree) h+='<p class="lbl">KLASÖR YAPISI</p><div class="tree">'+esc(a.tree)+'</div>';
  if(a.starter) h+='<div class="starter"><p class="lbl">BAŞLANGIÇ DOSYASI · '+esc(a.starter.file)+'</p><pre class="code">'+hlHTML(a.starter.code)+'</pre></div>';
  h+='<p class="lbl">GEREKSİNİMLER</p><div class="prog" data-prog="'+i+'"></div><ol class="reqs" data-reqs="'+i+'">'+
    a.reqs.map((r,k)=>'<li><input type="checkbox" aria-label="Gereksinim '+(k+1)+' tamamlandı"><span>'+md(r)+'</span></li>').join('')+'</ol>';
  if(a.note) h+='<div class="note">'+md(a.note)+'</div>';
  h+='<div class="self"><div class="h">KENDİNİ SINA</div><p>'+md(a.self.q)+'</p><button class="link-btn" data-self>Cevabı göster</button><div class="ans">'+md(a.self.a)+'</div></div>';
  h+='</div><div class="preview-col"><p class="lbl">BİTMİŞ SAYFA</p>'+
    '<div class="browser" data-br="'+i+'"><div class="chrome"><span class="tab"></span></div><div class="chrome bar"><button data-back title="Geri" aria-label="Geri">←</button><button data-home title="Başlangıç sayfasına dön" aria-label="Başlangıç sayfasına dön">⟲</button><span class="addr"></span></div>'+
    '<iframe class="preview" title="Bitmiş sayfa önizlemesi"></iframe><div class="navline"><span class="k">GEZİNME</span><span class="v">—</span></div></div>'+
    '<div class="sol"><button class="sol-btn">Örnek çözümü göster</button><div class="sol-body"><div class="ftabs"></div><pre class="code"></pre>'+(a.solNote?'<p class="sol-note">'+md(a.solNote)+'</p>':'')+'</div></div>'+
    '</div></div></section>';
});
app.innerHTML=h;

// Gereksinim kutuları
document.querySelectorAll('[data-reqs]').forEach(ol=>{
  const i=+ol.dataset.reqs,prog=document.querySelector('[data-prog="'+i+'"]');
  const upd=()=>{const all=ol.querySelectorAll('input'),d=[...all].filter(x=>x.checked).length;prog.innerHTML='Tamamlanan: <b>'+d+'</b> / '+all.length;};
  ol.querySelectorAll('input').forEach(c=>c.onchange=()=>{c.closest('li').classList.toggle('done',c.checked);upd();});
  upd();
});
document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{const s=b.closest('.self');s.classList.toggle('open');b.textContent=s.classList.contains('open')?'Cevabı gizle':'Cevabı göster';});

// Çözüm
document.querySelectorAll('.app').forEach((sec,i)=>{
  const a=apps[i],sol=sec.querySelector('.sol'),tabs=sol.querySelector('.ftabs'),pre=sol.querySelector('pre');
  const files=Object.keys(a.files).filter(p=>typeof a.files[p]==='string'&&!(a.solSkip||[]).includes(p));
  function show(p){pre.innerHTML='<span class="fn">'+esc(p)+'</span>'+hlHTML(a.files[p]);tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===p));}
  tabs.innerHTML=files.length>1?files.map(p=>'<button data-f="'+esc(p)+'">'+esc(p)+'</button>').join(''):'';
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.f));
  show(files[0]);
  sol.querySelector('.sol-btn').onclick=()=>{sol.classList.toggle('open');sol.querySelector('.sol-btn').textContent=sol.classList.contains('open')?'Örnek çözümü gizle':'Örnek çözümü göster';};
});

// --- Gezilebilir önizleme ---
const BASE='http://site.test/';
const HOOK='<'+'script>(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a)return;e.preventDefault();parent.postMessage({__br:window.name,href:a.getAttribute("href"),target:a.getAttribute("target"),rel:a.getAttribute("rel"),download:a.hasAttribute("download")?a.getAttribute("download"):null,text:a.textContent.trim()},"*");});})();<\/script>';
const BR=[];
function scrollEl(t){const d=t.ownerDocument,se=d.scrollingElement||d.documentElement;se.scrollTop=t.getBoundingClientRect().top+se.scrollTop;}
function page404(p){return '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>404 Bulunamadı</title></head><body style="font-family:sans-serif;padding:24px"><h1>404 Not Found</h1><p>Sunucu <b>/'+esc(p)+'</b> adresinde bir dosya bulamadı.</p></body></html>';}
function fileNote(p){return '<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>'+esc(p)+'</title></head><body style="font-family:sans-serif;padding:24px;color:#333"><p><b>'+esc(p)+'</b> bir HTML sayfası değil. Gerçek tarayıcı bu dosyayı ya bir uygulamayla açar ya da indirir.</p></body></html>';}
function titleOf(html){const m=/<title>([\s\S]*?)<\/title>/i.exec(html);return m?m[1].trim():'(sekme yazısı yok)';}
function inject(html){return /<\/body>/i.test(html)?html.replace(/<\/body>/i,HOOK+'</body>'):html+HOOK;}

document.querySelectorAll('.browser').forEach((el,i)=>{
  const a=apps[i],fr=el.querySelector('iframe'),addr=el.querySelector('.addr'),tab=el.querySelector('.tab'),nav=el.querySelector('.navline .v');
  fr.name='br'+i;
  fr.addEventListener('load',()=>{try{const h=fr.contentDocument.documentElement.getBoundingClientRect().height;const mx=window.innerWidth<900?360:420;fr.style.height=Math.max(180,Math.min(mx,Math.ceil(h)+8))+'px';}catch(e){}});
  const st={cur:null,hist:[]};
  BR[i]={el,a,fr,st};
  function setNav(t){nav.innerHTML=t;}
  function scrollTo(hash){
    const d=fr.contentDocument;if(!d)return false;
    if(!hash){d.documentElement.scrollTop=0;return true;}
    const t=d.getElementById(decodeURIComponent(hash));
    if(t){scrollEl(t);return true;}
    return false;
  }
  function load(path,hash,push,msg){
    if(push&&st.cur) st.hist.push(st.cur);
    st.cur={path,hash};
    const f=a.files[path];
    let html;
    if(f===undefined) html=page404(path); else if(f===null) html=fileNote(path); else html=f;
    tab.textContent=titleOf(html);
    addr.textContent=BASE.replace('http://','')+path+(hash?'#'+hash:'');
    addr.classList.toggle('hit',!!push);
    fr.onload=()=>{
      if(hash){ if(!scrollTo(hash)) setNav((msg?msg+' · ':'')+'<b style="color:#ff6b8a">#'+esc(hash)+'</b> adlı öğe bulunamadı; sayfa başında kalındı (sessiz hata).'); }
    };
    fr.srcdoc=f===undefined||f===null?html:inject(html);
    el.querySelector('[data-back]').disabled=!st.hist.length;
    if(msg) setNav(msg); else if(!push) setNav('—');
  }
  el.querySelector('[data-back]').onclick=()=>{const p=st.hist.pop();if(p){load(p.path,p.hash,false,'Önceki sayfaya dönüldü.');el.querySelector('[data-back]').disabled=!st.hist.length;}};
  el.querySelector('[data-home]').onclick=()=>{st.hist=[];load(a.start,'',false);};
  load(a.start,'',false);
});

window.addEventListener('message',e=>{
  const d=e.data;if(!d||d.__br===undefined) return;
  const b=BR.find(x=>x.fr.contentWindow===e.source);if(!b) return;
  const {a,st,el}=b,nav=el.querySelector('.navline .v'),addr=el.querySelector('.addr');
  const say=t=>{nav.innerHTML=t;};
  if(d.href===null){say('<b>'+esc(d.text)+'</b> bir bağlantı değil (hedef adresi yok); tıklanınca hiçbir şey olmaz.');return;}
  let u;
  try{u=new URL(d.href,BASE+st.cur.path);}catch(err){say('Geçersiz adres: '+esc(d.href));return;}
  const tgt=d.target==='_blank'?' · <b>yeni sekmede</b> açılırdı'+(d.rel?' (rel="'+esc(d.rel)+'")':''):'';
  if(u.protocol==='mailto:'){
    const to=decodeURIComponent(u.pathname),ps=new URLSearchParams(u.search);
    say('E-posta uygulaması yeni bir taslakla açılırdı → Kime: <b>'+esc(to)+'</b>'+(ps.get('subject')?' · Konu: <b>'+esc(ps.get('subject'))+'</b>':'')+(ps.get('body')?' · Gövde: <b>'+esc(ps.get('body'))+'</b>':''));return;}
  if(u.protocol==='tel:'){say('Telefonda arama ekranı açılırdı → <b>'+esc(decodeURIComponent(u.pathname))+'</b>');return;}
  if(u.origin+'/'!==BASE){say('Dış siteye gidilirdi: <b>'+esc(u.href)+'</b>'+(tgt||' · aynı sekmede')+' (önizlemede dış siteler açılmaz).');return;}
  const path=decodeURIComponent(u.pathname.slice(1)),hash=u.hash.slice(1);
  if(d.download!==null){
    const name=d.download||path.split('/').pop();
    if(a.files[path]===undefined){say('İndirilecek dosya bulunamadı: /'+esc(path)+' (404)');return;}
    say('Dosya açılmadı; <b>'+esc(name)+'</b> adıyla <b>indirilirdi</b>.'+(d.download?' (önerilen ad)':' (kendi adı)'));return;}
  if(path===st.cur.path&&d.href.startsWith('#')){
    st.hist.push({...st.cur});st.cur={path,hash};
    addr.textContent=BASE.replace('http://','')+path+(hash?'#'+hash:'');
    el.querySelector('[data-back]').disabled=false;
    if(!hash){b.fr.contentDocument.documentElement.scrollTop=0;say('Hedef boş (#): sayfanın başına gidildi. Yeni sayfa istenmedi.');return;}
    const t=b.fr.contentDocument.getElementById(decodeURIComponent(hash));
    if(t){scrollEl(t);say('Aynı sayfada <b>#'+esc(hash)+'</b> bölümüne kaydırıldı. Sunucuya istek gitmedi.');}
    else say('<b style="color:#ff6b8a">#'+esc(hash)+'</b> adlı öğe bulunamadı; hiçbir şey olmadı (sessiz hata).');
    return;
  }
  const exists=a.files[path]!==undefined;
  let msg=exists?'<b>/'+esc(path)+'</b> istendi'+(hash?', sonra <b>#'+esc(hash)+'</b> bölümüne kaydırıldı':'')+tgt+'.':'<b style="color:#ff6b8a">404</b> · sunucu <b>/'+esc(path)+'</b> dosyasını bulamadı.';
  // aynı tarayıcı nesnesinin load fonksiyonunu kullan
  loadIn(b,path,hash,msg);
});
function loadIn(b,path,hash,msg){
  // load fonksiyonunu yeniden kurmadan çağırmak için olay tetikleyici
  const ev=new CustomEvent('br-load',{detail:{path,hash,msg}});
  b.el.dispatchEvent(ev);
}
document.querySelectorAll('.browser').forEach((el,i)=>{
  el.addEventListener('br-load',e=>{
    const b=BR[i],{path,hash,msg}=e.detail,a=b.a,st=b.st,fr=b.fr;
    st.hist.push(st.cur);st.cur={path,hash};
    const f=a.files[path];
    let html;
    if(f===undefined) html=page404(path); else if(f===null) html=fileNote(path); else html=f;
    el.querySelector('.tab').textContent=titleOf(html);
    const addr=el.querySelector('.addr');
    addr.textContent=BASE.replace('http://','')+path+(hash?'#'+hash:'');addr.classList.add('hit');
    const nav=el.querySelector('.navline .v');nav.innerHTML=msg;
    fr.onload=()=>{ if(hash){const t=fr.contentDocument.getElementById(decodeURIComponent(hash)); if(t)scrollEl(t); else nav.innerHTML=msg.replace(/, sonra.*?kaydırıldı/,'')+' · <b style="color:#ff6b8a">#'+esc(hash)+'</b> bulunamadı; sayfa başında kalındı (sessiz hata).';} };
    fr.srcdoc=f===undefined||f===null?html:inject(html);
    el.querySelector('[data-back]').disabled=false;
  });
});
})();
</script>
</body>
</html>
